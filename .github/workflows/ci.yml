name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Fail on errors/warnings; seed has many info lints that should not block the pipeline.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
